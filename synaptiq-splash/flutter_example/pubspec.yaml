name: synaptiq_splash_example
description: Synaptiq splash screen using the lottie package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.1

flutter:
  uses-material-design: true
  assets:
    # Copy ../synaptiq_splash.json here (or point this at your own path).
    - assets/animations/synaptiq_splash.json

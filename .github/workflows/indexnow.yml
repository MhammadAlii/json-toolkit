name: IndexNow

# Vercel reports each deployment to GitHub; after a successful production deploy, submit the sitemap's URLs.
on: deployment_status

permissions:
  contents: read

jobs:
  submit:
    name: Submit URLs
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/indexnow.mjs
        env:
          SITE_URL: https://getjsontoolkit.com
